name: Phase 1 Live Overlay Diagnosis

on:
  push:
    branches:
      - phase-1-nav-state-diagnosis
    paths:
      - ".github/workflows/phase1-live-overlay-diagnosis.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1-nav-state-diagnosis

      - name: Check browser availability
        shell: bash
        run: |
          which google-chrome || which chromium || which chromium-browser || true

      - name: Install lightweight browser tooling
        shell: bash
        run: |
          python -m pip install selenium --quiet

      - name: Inspect live Thai switch state
        shell: bash
        run: |
          python - <<'PY'
          import json, shutil, time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options

          chrome = shutil.which("google-chrome") or shutil.which("chromium") or shutil.which("chromium-browser")
          if not chrome:
              raise RuntimeError("No Chrome/Chromium available")

          opts=Options()
          opts.binary_location=chrome
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--window-size=430,932")

          d=webdriver.Chrome(options=opts)
          d.get("https://noor-arief.github.io/Jelajah-nusantara/")
          time.sleep(2)

          d.find_element(By.CSS_SELECTOR,".jl-language-trigger").click()
          time.sleep(.3)
          d.find_element(By.CSS_SELECTOR,'.jl-language-menu button[data-lang="th"]').click()
          time.sleep(1)

          state=d.execute_script("""
          const q=s=>document.querySelector(s);
          const css=e=>e?getComputedStyle(e):null;
          const pack=(s)=>{const e=q(s),c=css(e);return e?{
            selector:s,
            className:e.className,
            style:e.getAttribute('style'),
            display:c.display,
            opacity:c.opacity,
            visibility:c.visibility,
            pointerEvents:c.pointerEvents,
            zIndex:c.zIndex,
            position:c.position,
            ariaExpanded:e.getAttribute('aria-expanded')
          }:null};
          return {
            lang:document.documentElement.lang,
            bodyStyle:document.body.getAttribute('style'),
            languageRoot:pack('#jelLanguageSwitcher'),
            languageMenu:pack('.jl-language-menu'),
            languageBackdrop:pack('.jl-language-backdrop'),
            primaryNav:pack('#primaryNav'),
            navBackdrop:pack('#navBackdrop'),
            navToggle:pack('.nav-toggle'),
            overlays:[...document.querySelectorAll('*')].filter(e=>{
              const c=getComputedStyle(e);
              const r=e.getBoundingClientRect();
              return c.position==='fixed' && c.display!=='none' && c.visibility!=='hidden' &&
                parseFloat(c.opacity||'1')>0 && r.width>=window.innerWidth*.9 && r.height>=window.innerHeight*.7;
            }).slice(0,20).map(e=>({tag:e.tagName,id:e.id,className:e.className,style:e.getAttribute('style'),z:getComputedStyle(e).zIndex,background:getComputedStyle(e).backgroundColor}))
          };
          """)
          Path("phase1-live-overlay-state.json").write_text(json.dumps(state,ensure_ascii=False,indent=2),encoding="utf-8")
          d.quit()
          print(json.dumps(state,ensure_ascii=False,indent=2))
          PY

      - name: Commit diagnosis
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase1-live-overlay-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: capture live mobile overlay state"
          git push origin HEAD:phase-1-nav-state-diagnosis
