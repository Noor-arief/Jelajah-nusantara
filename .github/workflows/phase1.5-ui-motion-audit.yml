name: Phase 1.5 UI Motion Audit

on:
  push:
    branches:
      - phase-1.5-ui-motion-polish
    paths:
      - ".github/workflows/phase1.5-ui-motion-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1.5-ui-motion-polish

      - run: python -m pip install selenium --quiet

      - name: Audit live production selectors and motion baseline
        shell: bash
        run: |
          python - <<'PY'
          import json, shutil, time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          opts=Options()
          opts.binary_location=shutil.which("google-chrome")
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--window-size=1440,1200")

          d=webdriver.Chrome(options=opts)
          d.get("https://noor-arief.github.io/Jelajah-nusantara/")
          time.sleep(3)

          data=d.execute_script("""
          const compact=e=>{
            const c=getComputedStyle(e);
            return {
              tag:e.tagName,id:e.id||null,className:e.className||null,
              text:(e.innerText||e.textContent||'').trim().slice(0,120),
              animation:c.animation,transition:c.transition,
              transform:c.transform,opacity:c.opacity
            };
          };
          const all=[...document.querySelectorAll('*')];
          const pick=fn=>all.filter(fn).slice(0,80).map(compact);
          const nusa=pick(e=>/ask nusa|nusa/i.test((e.innerText||e.textContent||'')) || /nusa/i.test(String(e.id||'')) || /nusa/i.test(String(e.className||'')));
          return {
            cards:pick(e=>/card/.test(String(e.className||'')) && e.getBoundingClientRect().width>100),
            buttons:pick(e=>e.matches('button,.btn,a[class*="btn"],[role="button"]')),
            sections:pick(e=>e.tagName==='SECTION'),
            nusa,
            language:pick(e=>/jl-language/.test(String(e.className||''))),
            bodyClasses:document.body.className
          };
          """)
          Path("phase1.5-ui-motion-audit.json").write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding="utf-8")
          d.quit()
          PY

      - name: Commit audit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase1.5-ui-motion-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: audit Phase 1.5 UI motion selectors"
          git push origin HEAD:phase-1.5-ui-motion-polish
