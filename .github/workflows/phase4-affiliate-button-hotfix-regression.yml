name: Phase 4 Affiliate Button Hotfix Regression

on:
  push:
    branches:
      - phase4-affiliate-button-hotfix
    paths:
      - ".github/workflows/phase4-affiliate-button-hotfix-regression.yml"
      - "affiliate/affiliate-card-integration.js"
      - "affiliate/manual-affiliate-links-template.csv"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4-affiliate-button-hotfix

      - name: Validate manual mapping
        shell: bash
        run: |
          python - <<'PY'
          import csv
          rows=list(csv.DictReader(open('affiliate/manual-affiliate-links-template.csv',encoding='utf-8')))
          assert len(rows)==35,len(rows)
          assert len({r['destination'] for r in rows})==35
          assert all(r['booking_base_url'].startswith('https://www.booking.com/searchresults.html?ss=') for r in rows)
          assert all(r['manual_affiliate_url']=='' for r in rows)
          print('PASS manual mapping 35 destinations')
          PY

      - run: python -m pip install selenium --quiet

      - name: Validate same-tab card navigation
        shell: bash
        run: |
          python -m http.server 8080 >/tmp/phase4-hotfix.log 2>&1 &
          echo $! >/tmp/phase4-hotfix.pid
          sleep 2
          python - <<'PY'
          import shutil,time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options

          o=Options();o.binary_location=shutil.which('google-chrome')
          o.add_argument('--headless=new');o.add_argument('--no-sandbox');o.add_argument('--disable-dev-shm-usage')
          o.add_argument('--window-size=430,932')
          d=webdriver.Chrome(options=o)
          d.get('http://127.0.0.1:8080/')
          time.sleep(4)
          a=d.find_element(By.CSS_SELECTOR,'.region-card .jl-affiliate-card-cta')
          assert a.get_attribute('target') in (None,''),a.get_attribute('target')
          before=d.window_handles[:]
          d.execute_script("arguments[0].scrollIntoView({block:'center'})",a)
          time.sleep(.2)
          a.click()
          time.sleep(2)
          after=d.window_handles[:]
          assert len(after)==len(before)==1,(before,after)
          assert 'booking.com' in d.current_url or 'assistant.vireqo.id/affiliate/out' in d.current_url,d.current_url
          d.quit()
          print('PASS same-tab destination CTA')
          PY

      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/phase4-hotfix.pid ]; then kill "$(cat /tmp/phase4-hotfix.pid)" || true; fi
