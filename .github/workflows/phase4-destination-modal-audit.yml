name: Phase 4 Destination Modal Audit

on:
  push:
    branches:
      - phase4-destination-modal-affiliate-hotfix
    paths:
      - ".github/workflows/phase4-destination-modal-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4-destination-modal-affiliate-hotfix
      - run: python -m pip install selenium --quiet
      - name: Inspect live Raja Ampat modal and card CTA
        shell: bash
        run: |
          python - <<'PY'
          import json,shutil,time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options

          o=Options();o.binary_location=shutil.which('google-chrome')
          o.add_argument('--headless=new');o.add_argument('--no-sandbox');o.add_argument('--disable-dev-shm-usage')
          o.add_argument('--window-size=1440,1200')
          d=webdriver.Chrome(options=o)
          d.get('https://noor-arief.github.io/Jelajah-nusantara/')
          time.sleep(5)

          card=d.find_element(By.XPATH,"//*[contains(@class,'region-card')][.//h3[normalize-space()='Raja Ampat']]")
          cta=card.find_element(By.CSS_SELECTOR,'.jl-affiliate-card-cta')
          card_audit=d.execute_script("""
            const a=arguments[0],r=a.getBoundingClientRect(),p=document.elementFromPoint(r.x+r.width/2,r.y+r.height/2);
            return {
              href:a.href,target:a.getAttribute('target'),
              rect:{x:r.x,y:r.y,w:r.width,h:r.height},
              topElement:p?{tag:p.tagName,className:String(p.className||''),text:(p.innerText||p.textContent||'').trim().slice(0,200)}:null,
              cardOnclick:a.closest('.region-card')?.getAttribute('onclick'),
              actions:a.parentElement?.outerHTML
            };
          """,cta)

          explore=card.find_element(By.CSS_SELECTOR,'.region-explore')
          d.execute_script("arguments[0].click()",explore)
          time.sleep(.5)

          modal=d.execute_script("""
            const els=[...document.querySelectorAll('body *')];
            const candidate=els.find(e=>{
              const t=(e.innerText||'');
              return t.includes('Raja Ampat') && /Tautan Pemesanan|Booking Link|Accommodation|Akomodasi|Segera Hadir|Coming Soon/i.test(t) && e.getBoundingClientRect().height>300;
            });
            if(!candidate) return null;
            const buttons=[...candidate.querySelectorAll('a,button')].map(x=>({
              tag:x.tagName,className:String(x.className||''),text:(x.innerText||x.textContent||'').trim(),
              href:x.getAttribute('href'),disabled:x.disabled,hidden:x.hidden,
              onclick:x.getAttribute('onclick')
            }));
            return {
              tag:candidate.tagName,id:candidate.id,className:String(candidate.className||''),
              html:candidate.outerHTML.slice(0,30000),
              buttons
            };
          """)

          Path('phase4-destination-modal-audit.json').write_text(json.dumps({'card':card_audit,'modal':modal},ensure_ascii=False,indent=2),encoding='utf-8')
          d.quit()
          PY
      - name: Commit audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase4-destination-modal-audit.json
          git commit -m "chore: audit live destination modal affiliate controls"
          git push origin HEAD:phase4-destination-modal-affiliate-hotfix
