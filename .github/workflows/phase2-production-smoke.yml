name: Phase 2 Production Smoke

on:
  push:
    branches:
      - phase-2-faq-legal-implementation
    paths:
      - ".github/workflows/phase2-production-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2-faq-legal-implementation
      - run: python -m pip install selenium --quiet
      - name: Check live production
        shell: bash
        run: |
          python - <<'PY'
          import json,shutil,time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options

          opts=Options()
          opts.binary_location=shutil.which("google-chrome")
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--window-size=430,932")

          d=webdriver.Chrome(options=opts)
          d.get("https://noor-arief.github.io/Jelajah-nusantara/")
          time.sleep(4)

          s=d.execute_script("""
            const footer=document.querySelector('footer');
            const h=document.getElementById('vireqo-ai-jelnusa-staging');
            return {
              trustCss:[...document.styleSheets].some(x=>String(x.href||'').includes('trust-center.css')),
              trustJs:[...document.scripts].some(x=>String(x.src||'').includes('trust-center.js')),
              faq:!!document.getElementById('jl-faq'),
              affiliate:!!document.getElementById('jl-affiliate'),
              disclaimer:!!document.getElementById('jl-disclaimer'),
              faqVisible:!footer.querySelector('[data-i18n="FAQ"]').hidden,
              privacyVisible:!footer.querySelector('[data-i18n="Privacy Policy"]').hidden,
              partnershipVisible:!footer.querySelector('[data-i18n="Partnerships"]').hidden,
              affiliateLink:!!footer.querySelector('[data-jl-trust="affiliate"]'),
              disclaimerLink:!!footer.querySelector('[data-jl-trust="disclaimer"]'),
              oldEmail:document.documentElement.innerHTML.includes('arifmuhamad942@gmail.com'),
              newEmail:document.documentElement.innerHTML.includes('arifmuhamad94@gmail.com'),
              termsAI:!!document.querySelector('.jl-terms-ai-addendum'),
              privacyAI:!!document.querySelector('.jl-privacy-ai-addendum'),
              nusa:!!(h&&h.shadowRoot&&h.shadowRoot.querySelector('.vireqo-ai-launcher'))
            };
          """)
          print(json.dumps(s,indent=2))
          assert all([
            s["trustCss"],s["trustJs"],s["faq"],s["affiliate"],s["disclaimer"],
            s["faqVisible"],s["privacyVisible"],s["partnershipVisible"],
            s["affiliateLink"],s["disclaimerLink"],s["newEmail"],
            s["termsAI"],s["privacyAI"],s["nusa"]
          ]),s
          assert not s["oldEmail"],s

          for lang in ["id","ar","th","en"]:
            d.find_element(By.CSS_SELECTOR,'.jl-language-trigger').click()
            time.sleep(.2)
            d.find_element(By.CSS_SELECTOR,f'.jl-language-menu button[data-lang="{lang}"]').click()
            time.sleep(.35)
            assert d.execute_script("return document.documentElement.lang")==lang

          d.quit()
          print("PASS live Phase 2 production smoke")
          PY
