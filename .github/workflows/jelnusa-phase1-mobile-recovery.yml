name: JelNusa Phase 1 Mobile Recovery Patch

on:
  push:
    branches:
      - phase-1-mobile-recovery
    paths:
      - '.github/workflows/jelnusa-phase1-mobile-recovery.yml'

permissions:
  contents: write

jobs:
  patch-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout phase branch
        uses: actions/checkout@v4
        with:
          ref: phase-1-mobile-recovery
          fetch-depth: 0

      - name: Apply targeted mobile recovery patch
        run: python .github/scripts/patch_mobile_recovery.py

      - name: Validate protected markers
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("index.html").read_text(encoding="utf-8")
          checks = {
              "mobile_patch": 'id="jelnusa-phase1-mobile-recovery-v1"' in s,
              "nusa_loader": "https://assistant.vireqo.id/client.js" in s,
              "jelnusa_tenant": 'data-client-id="jelnusa-staging"' in s,
              "i18next": "i18next" in s,
              "html_close": s.rstrip().endswith("</html>"),
          }
          print(checks)
          if not all(checks.values()):
              raise SystemExit("validation failed")
          PY

      - name: Commit branch-only patch
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html change required."
            exit 0
          fi
          git config user.name "BimaGinga"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Phase 1: apply isolated mobile recovery layer"
          git push origin HEAD:phase-1-mobile-recovery
