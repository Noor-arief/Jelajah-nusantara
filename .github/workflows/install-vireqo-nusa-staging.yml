name: JelNusa NUSA staging install

on:
  push:
    branches:
      - vireqo-nusa-staging
    paths:
      - .github/workflows/install-vireqo-nusa-staging.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vireqo-nusa-staging
          fetch-depth: 0

      - name: Add Vireqo NUSA loader safely
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          marker = 'data-client-id="jelnusa-staging"'
          snippet = '  <script src="https://assistant.vireqo.id/client.js" data-client-id="jelnusa-staging" async defer></script>\n'

          text = path.read_text(encoding="utf-8")
          if marker in text:
              print("NUSA loader already installed; no change needed.")
              raise SystemExit(0)

          closing = text.lower().rfind("</body>")
          if closing < 0:
              raise SystemExit("Refusing to modify index.html: closing </body> not found.")

          updated = text[:closing] + snippet + text[closing:]

          if updated.count(marker) != 1:
              raise SystemExit("Refusing to modify index.html: expected exactly one NUSA loader.")

          path.write_text(updated, encoding="utf-8")
          print("Added exactly one NUSA loader before final </body>.")

      - name: Verify isolated additive diff
        run: |
          git diff --check
          git diff --unified=3 -- index.html
          test "$(git diff --numstat -- index.html | awk '{print $1}')" = "1"
          test "$(git diff --numstat -- index.html | awk '{print $2}')" = "0"

      - name: Commit staging-only integration
        run: |
          if git diff --quiet -- index.html; then
            echo "No integration change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: install Vireqo NUSA staging loader"
          git push origin HEAD:vireqo-nusa-staging
