name: Phase 4 Card DOM Audit

on:
  push:
    branches:
      - phase-4-affiliate-integration
    paths:
      - ".github/workflows/phase4-card-dom-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-affiliate-integration

      - run: python -m pip install selenium --quiet

      - name: Inspect live destination cards
        shell: bash
        run: |
          python - <<'PY'
          import json, shutil, time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          opts=Options()
          opts.binary_location=shutil.which("google-chrome")
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--window-size=1440,1400")

          d=webdriver.Chrome(options=opts)
          d.get("https://noor-arief.github.io/Jelajah-nusantara/")
          time.sleep(4)

          out=d.execute_script("""
            const cards=[...document.querySelectorAll('.region-card')];
            return {
              count:cards.length,
              cards:cards.slice(0,8).map((c,i)=>({
                i,
                outerHTML:c.outerHTML.slice(0,12000),
                text:(c.innerText||'').trim(),
                classes:[...c.classList],
                children:[...c.children].map(x=>({tag:x.tagName,className:x.className,text:(x.innerText||'').trim().slice(0,300)}))
              })),
              firstParent:cards[0]?.parentElement?.outerHTML?.slice(0,16000)||null
            };
          """)
          Path("phase4-card-dom-audit.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          d.quit()
          PY

      - name: Commit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase4-card-dom-audit.json
          git commit -m "chore: audit Phase 4 destination card DOM"
          git push origin HEAD:phase-4-affiliate-integration
