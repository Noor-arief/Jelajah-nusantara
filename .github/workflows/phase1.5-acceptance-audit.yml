name: Phase 1.5 Acceptance Audit

on:
  push:
    branches:
      - phase-1.5-acceptance-fixes
    paths:
      - ".github/workflows/phase1.5-acceptance-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1.5-acceptance-fixes
      - run: python -m pip install selenium --quiet
      - name: Audit live production feedback areas
        shell: bash
        run: |
          python - <<'PY'
          import json, shutil, time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          opts=Options()
          opts.binary_location=shutil.which("google-chrome")
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--window-size=1440,1200")
          d=webdriver.Chrome(options=opts)
          d.get("https://noor-arief.github.io/Jelajah-nusantara/")
          time.sleep(4)

          data=d.execute_script("""
          const pack=e=>{
            const c=getComputedStyle(e),r=e.getBoundingClientRect();
            return {
              tag:e.tagName,id:e.id||null,className:String(e.className||''),
              text:(e.innerText||e.textContent||'').trim().slice(0,180),
              href:e.getAttribute('href'),
              display:c.display,
              gridTemplateColumns:c.gridTemplateColumns,
              gap:c.gap,
              width:r.width,height:r.height,x:r.x,y:r.y
            };
          };
          const pillarCards=[...document.querySelectorAll('.pillar-card')].map(pack);
          const pillarParents=[...new Set([...document.querySelectorAll('.pillar-card')].map(e=>e.parentElement))].map(pack);
          const footer=document.querySelector('footer');
          const footerLinks=footer?[...footer.querySelectorAll('a,button')].map(pack):[];
          const coming=[...document.querySelectorAll('a,button')].filter(e=>/coming soon/i.test((e.innerText||e.textContent||''))).map(pack);
          const host=document.getElementById('vireqo-ai-jelnusa-staging');
          let nusa=null;
          if(host&&host.shadowRoot){
            const r=host.shadowRoot;
            nusa={
              launcher:pack(r.querySelector('.vireqo-ai-launcher')),
              shell:pack(r.querySelector('.vireqo-ai-shell')),
              widget:pack(r.querySelector('.vireqo-ai-widget')),
              style:r.querySelector('style')?.textContent?.slice(0,12000)||''
            };
          }
          return {pillarCards,pillarParents,footerLinks,coming,nusa};
          """)
          Path("phase1.5-acceptance-audit.json").write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding="utf-8")
          d.quit()
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase1.5-acceptance-audit.json
          git commit -m "chore: audit Phase 1.5 acceptance feedback"
          git push origin HEAD:phase-1.5-acceptance-fixes
