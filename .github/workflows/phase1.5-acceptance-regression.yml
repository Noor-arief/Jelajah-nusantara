name: Phase 1.5 Acceptance Fix Regression

on:
  push:
    branches:
      - phase-1.5-acceptance-fixes
    paths:
      - ".github/workflows/phase1.5-acceptance-regression.yml"
      - "assets/ui-motion-polish.css"
      - "assets/ui-motion-polish.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1.5-acceptance-fixes
      - run: python -m pip install selenium --quiet

      - name: Start local site
        shell: bash
        run: |
          python -m http.server 8080 >/tmp/jelnusa-http.log 2>&1 &
          echo $! >/tmp/jelnusa-http.pid
          sleep 2

      - name: Desktop + footer + cards
        shell: bash
        run: |
          python - <<'PY'
          import json, shutil, time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          opts=Options()
          opts.binary_location=shutil.which("google-chrome")
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--window-size=1440,1200")
          d=webdriver.Chrome(options=opts)
          d.get("http://127.0.0.1:8080/")
          time.sleep(3)

          state=d.execute_script("""
          const grid=document.querySelector('.pillars-grid');
          const cards=[...document.querySelectorAll('.pillar-card')];
          const footer=document.querySelector('footer');
          const byText=t=>[...footer.querySelectorAll('a')].find(a=>(a.textContent||'').trim().toLowerCase()===t);
          const contact=byText('contact');
          const deferred=['blog','photo gallery','tools','packing list','faq','privacy policy','partnerships'];
          const deferredState=Object.fromEntries(deferred.map(t=>{
            const a=byText(t);return [t,a?{hidden:a.hidden,display:getComputedStyle(a).display}:null];
          }));
          const hotel=document.querySelector('.region-hotel-disabled');
          const email=footer.querySelector('.jl-footer-email');
          return {
            grid:getComputedStyle(grid).gridTemplateColumns,
            cardCount:cards.length,
            footerContact:contact&&contact.getAttribute('href'),
            deferred:deferredState,
            hotelDisplay:hotel?getComputedStyle(hotel).display:null,
            emailHref:email&&email.getAttribute('href'),
            motion:document.documentElement.classList.contains('jl-phase15-motion')
          };
          """)
          print(json.dumps(state,indent=2))
          assert state["cardCount"]==6,state
          assert len(state["grid"].split())==3,state
          assert state["footerContact"]=="mailto:arifmuhamad94@gmail.com",state
          assert state["emailHref"]=="mailto:arifmuhamad94@gmail.com",state
          assert state["hotelDisplay"]=="none",state
          assert state["motion"],state
          for k,v in state["deferred"].items():
            assert v and v["hidden"],(k,v)

          # repeated language still stable
          for lang in ["id","ar","en"]:
            d.find_element(By.CSS_SELECTOR,'.jl-language-trigger').click()
            time.sleep(.2)
            d.find_element(By.CSS_SELECTOR,f'.jl-language-menu button[data-lang="{lang}"]').click()
            time.sleep(.3)
            assert d.execute_script("return document.documentElement.lang")==lang

          d.quit()
          print("PASS desktop/footer/cards/language")
          PY

      - name: Tablet + mobile cards
        shell: bash
        run: |
          python - <<'PY'
          import shutil,time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          for width,expected in [(900,2),(430,1)]:
            opts=Options()
            opts.binary_location=shutil.which("google-chrome")
            opts.add_argument("--headless=new")
            opts.add_argument("--no-sandbox")
            opts.add_argument("--disable-dev-shm-usage")
            opts.add_argument(f"--window-size={width},932")
            d=webdriver.Chrome(options=opts)
            d.get("http://127.0.0.1:8080/")
            time.sleep(2)
            cols=d.execute_script("return getComputedStyle(document.querySelector('.pillars-grid')).gridTemplateColumns")
            count=len(cols.split())
            print(width,cols,count)
            assert count==expected,(width,cols,count)
            assert d.execute_script("return document.documentElement.scrollWidth <= innerWidth + 2")
            d.quit()
          print("PASS responsive cards")
          PY

      - name: Live-origin NUSA visual prominence
        shell: bash
        run: |
          python - <<'PY'
          import json,shutil,time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          branch_js=Path("assets/ui-motion-polish.js").read_text(encoding="utf-8")
          opts=Options()
          opts.binary_location=shutil.which("google-chrome")
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--window-size=430,932")
          d=webdriver.Chrome(options=opts)
          d.get("https://noor-arief.github.io/Jelajah-nusantara/")
          time.sleep(4)
          d.execute_script(branch_js)
          time.sleep(1)
          s=d.execute_script("""
          const r=document.getElementById('vireqo-ai-jelnusa-staging').shadowRoot;
          const l=r.querySelector('.vireqo-ai-launcher');
          const w=r.querySelector('.vireqo-ai-widget');
          const lr=l.getBoundingClientRect();
          return {
            launcherW:lr.width,launcherH:lr.height,
            shadow:getComputedStyle(l).boxShadow,
            widgetW:getComputedStyle(w).width,
            inputFont:getComputedStyle(r.querySelector('.vireqo-ai-inputbar input')).fontSize,
            style:!!r.getElementById('jl-nusa-motion-v1')
          };
          """)
          print(json.dumps(s,indent=2))
          assert s["style"],s
          assert s["launcherH"]>=58,s
          assert s["launcherW"]>=144,s
          assert s["inputFont"]=="16px",s
          d.quit()
          print("PASS NUSA prominence")
          PY

      - name: Stop local
        if: always()
        run: |
          if [ -f /tmp/jelnusa-http.pid ]; then kill "$(cat /tmp/jelnusa-http.pid)" || true; fi
