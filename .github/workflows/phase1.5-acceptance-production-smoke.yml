name: Phase 1.5 Acceptance Production Smoke

on:
  push:
    branches:
      - phase-1.5-acceptance-fixes
    paths:
      - ".github/workflows/phase1.5-acceptance-production-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1.5-acceptance-fixes
      - run: python -m pip install selenium --quiet
      - name: Check live production
        shell: bash
        run: |
          python - <<'PY'
          import json,shutil,time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options

          opts=Options()
          opts.binary_location=shutil.which("google-chrome")
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--window-size=1440,1200")
          d=webdriver.Chrome(options=opts)
          d.get("https://noor-arief.github.io/Jelajah-nusantara/")
          time.sleep(4)

          s=d.execute_script("""
          const footer=document.querySelector('footer');
          const byText=t=>[...footer.querySelectorAll('a')].find(a=>(a.textContent||'').trim().toLowerCase()===t);
          const h=document.getElementById('vireqo-ai-jelnusa-staging');
          const r=h&&h.shadowRoot;
          const l=r&&r.querySelector('.vireqo-ai-launcher');
          const lr=l&&l.getBoundingClientRect();
          return {
            cols:getComputedStyle(document.querySelector('.pillars-grid')).gridTemplateColumns,
            hotel:getComputedStyle(document.querySelector('.region-hotel-disabled')).display,
            contact:byText('contact')?.getAttribute('href'),
            blogHidden:byText('blog')?.hidden,
            email:footer.querySelector('.jl-footer-email')?.getAttribute('href'),
            nusaH:lr?.height||0,
            nusaW:lr?.width||0,
            nusaShadow:l?getComputedStyle(l).boxShadow:null
          };
          """)
          print(json.dumps(s,indent=2))
          assert len(s["cols"].split())==3,s
          assert s["hotel"]=="none",s
          assert s["contact"]=="mailto:arifmuhamad94@gmail.com",s
          assert s["blogHidden"] is True,s
          assert s["email"]=="mailto:arifmuhamad94@gmail.com",s
          assert s["nusaH"]>=62,s

          for lang in ["id","th","en"]:
            d.find_element(By.CSS_SELECTOR,'.jl-language-trigger').click()
            time.sleep(.2)
            d.find_element(By.CSS_SELECTOR,f'.jl-language-menu button[data-lang="{lang}"]').click()
            time.sleep(.3)
            assert d.execute_script("return document.documentElement.lang")==lang

          d.quit()
          print("PASS live acceptance smoke")
          PY
