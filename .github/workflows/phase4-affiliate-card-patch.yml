name: Phase 4 Affiliate Card Patch

on:
  push:
    branches:
      - phase-4-affiliate-integration
    paths:
      - ".github/workflows/phase4-affiliate-card-patch.yml"
      - "tools/phase4_affiliate_patch.py"
      - "affiliate/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-affiliate-integration
          fetch-depth: 1
      - name: Wire affiliate assets
        run: python tools/phase4_affiliate_patch.py
      - name: Validate protected scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -o 'affiliate/affiliate-config.js?v=20260928a' index.html | wc -l)" -eq 1
          test "$(grep -o 'affiliate/affiliate-engine.js?v=20260928a' index.html | wc -l)" -eq 1
          test "$(grep -o 'affiliate/affiliate-card-integration.js?v=20260928a' index.html | wc -l)" -eq 1
          test "$(grep -o 'affiliate/affiliate-ui.css?v=20260928a' index.html | wc -l)" -eq 1
          git diff --check
      - name: Commit wiring
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: wire Phase 4 destination affiliate CTAs"
          git push origin HEAD:phase-4-affiliate-integration
