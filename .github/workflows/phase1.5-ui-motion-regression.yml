name: Phase 1.5 UI Motion Regression

on:
  push:
    branches:
      - phase-1.5-ui-motion-polish
    paths:
      - ".github/workflows/phase1.5-ui-motion-regression.yml"
      - "assets/ui-motion-polish.css"
      - "assets/ui-motion-polish.js"
      - "index.html"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1.5-ui-motion-polish

      - run: python -m pip install selenium --quiet

      - name: Start local site
        shell: bash
        run: |
          python -m http.server 8080 >/tmp/jelnusa-http.log 2>&1 &
          echo $! > /tmp/jelnusa-http.pid
          sleep 2

      - name: Desktop + NUSA + language regression
        shell: bash
        run: |
          python - <<'PY'
          import json, shutil, time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options

          opts=Options()
          opts.binary_location=shutil.which("google-chrome")
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--window-size=1440,1000")

          d=webdriver.Chrome(options=opts)
          d.get("http://127.0.0.1:8080/")
          time.sleep(3)

          state=d.execute_script("""
          return {
            phase:document.documentElement.classList.contains('jl-phase15-motion'),
            cards:document.querySelectorAll('.region-card.jl-motion-target,.region-card.jl-motion-visible').length,
            sections:document.querySelectorAll('.jl-motion-target,.jl-motion-visible').length,
            css:[...document.styleSheets].some(s=>String(s.href||'').includes('ui-motion-polish.css')),
            js:[...document.scripts].some(s=>String(s.src||'').includes('ui-motion-polish.js')),
            nusaHost:!!document.getElementById('vireqo-ai-jelnusa-staging')
          };
          """)
          print("BASE",json.dumps(state))
          assert state["phase"] and state["css"] and state["js"], state
          assert state["cards"]>0 and state["sections"]>0, state
          assert state["nusaHost"], state

          # Language regression: EN -> ID -> TH
          d.find_element(By.CSS_SELECTOR,'.jl-language-trigger').click()
          time.sleep(.3)
          d.find_element(By.CSS_SELECTOR,'.jl-language-menu button[data-lang="id"]').click()
          time.sleep(.5)
          d.find_element(By.CSS_SELECTOR,'.jl-language-trigger').click()
          time.sleep(.3)
          d.find_element(By.CSS_SELECTOR,'.jl-language-menu button[data-lang="th"]').click()
          time.sleep(.5)
          assert d.execute_script("return document.documentElement.lang")=="th"

          # NUSA shadow motion + state transitions
          nusa=d.execute_script("""
          const h=document.getElementById('vireqo-ai-jelnusa-staging');
          const r=h&&h.shadowRoot;
          if(!r)return {ok:false};
          return {
            ok:true,
            style:!!r.getElementById('jl-nusa-motion-v1'),
            launcherAnim:getComputedStyle(r.querySelector('.vireqo-ai-launcher')).animationName,
            msgClass:r.querySelector('.vireqo-ai-message')?.className||''
          };
          """)
          print("NUSA_INIT",json.dumps(nusa))
          assert nusa["ok"] and nusa["style"], nusa
          assert "jl-nusa-message-enter" in nusa["msgClass"], nusa

          d.execute_script("""
          const r=document.getElementById('vireqo-ai-jelnusa-staging').shadowRoot;
          r.querySelector('.vireqo-ai-launcher').click();
          """)
          time.sleep(.4)
          open_state=d.execute_script("""
          const r=document.getElementById('vireqo-ai-jelnusa-staging').shadowRoot;
          const w=r.querySelector('.vireqo-ai-widget');
          const q=r.querySelector('.vireqo-ai-quick-action');
          return {
            hidden:w.hidden,
            widgetAnim:getComputedStyle(w).animationName,
            quickAnim:getComputedStyle(q).animationName
          };
          """)
          print("NUSA_OPEN",json.dumps(open_state))
          assert not open_state["hidden"], open_state
          assert open_state["widgetAnim"]!="none", open_state
          assert open_state["quickAnim"]!="none", open_state

          d.execute_script("""
          const r=document.getElementById('vireqo-ai-jelnusa-staging').shadowRoot;
          r.querySelector('.vireqo-ai-inputbar button').disabled=true;
          """)
          time.sleep(.2)
          thinking=d.execute_script("""
          const r=document.getElementById('vireqo-ai-jelnusa-staging').shadowRoot;
          return r.querySelector('.vireqo-ai-widget').className;
          """)
          assert "jl-nusa-thinking" in thinking, thinking

          d.execute_script("""
          const r=document.getElementById('vireqo-ai-jelnusa-staging').shadowRoot;
          r.querySelector('.vireqo-ai-inputbar button').disabled=false;
          """)
          time.sleep(.2)
          ready=d.execute_script("""
          const r=document.getElementById('vireqo-ai-jelnusa-staging').shadowRoot;
          return r.querySelector('.vireqo-ai-widget').className;
          """)
          assert "jl-nusa-ready" in ready, ready

          d.quit()
          print("PASS desktop + language + NUSA motion")
          PY

      - name: Mobile regression
        shell: bash
        run: |
          python - <<'PY'
          import json, shutil, time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          opts=Options()
          opts.binary_location=shutil.which("google-chrome")
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--window-size=430,932")

          d=webdriver.Chrome(options=opts)
          d.get("http://127.0.0.1:8080/")
          time.sleep(3)
          s=d.execute_script("""
          const h=document.getElementById('vireqo-ai-jelnusa-staging');
          const r=h&&h.shadowRoot;
          return {
            scrollWidth:document.documentElement.scrollWidth,
            innerWidth:innerWidth,
            nusaInput:r?getComputedStyle(r.querySelector('.vireqo-ai-inputbar input')).fontSize:null,
            motionClass:document.documentElement.classList.contains('jl-phase15-motion')
          };
          """)
          print("MOBILE",json.dumps(s))
          assert s["scrollWidth"]<=s["innerWidth"]+2, s
          assert s["motionClass"], s
          assert s["nusaInput"]=="16px", s
          d.quit()
          print("PASS mobile")
          PY

      - name: Reduced motion regression
        shell: bash
        run: |
          python - <<'PY'
          import json, shutil, time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          opts=Options()
          opts.binary_location=shutil.which("google-chrome")
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--window-size=430,932")
          d=webdriver.Chrome(options=opts)
          d.execute_cdp_cmd("Emulation.setEmulatedMedia",{
            "media":"",
            "features":[{"name":"prefers-reduced-motion","value":"reduce"}]
          })
          d.get("http://127.0.0.1:8080/")
          time.sleep(3)
          s=d.execute_script("""
          const card=document.querySelector('.region-card');
          const h=document.getElementById('vireqo-ai-jelnusa-staging');
          const r=h&&h.shadowRoot;
          const launcher=r&&r.querySelector('.vireqo-ai-launcher');
          return {
            cardTransition:getComputedStyle(card).transitionDuration,
            launcherAnimation:launcher?getComputedStyle(launcher).animationName:null
          };
          """)
          print("REDUCED",json.dumps(s))
          assert s["launcherAnimation"]=="none", s
          d.quit()
          print("PASS reduced motion")
          PY

      - name: Stop local site
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/jelnusa-http.pid ]; then kill "$(cat /tmp/jelnusa-http.pid)" || true; fi
