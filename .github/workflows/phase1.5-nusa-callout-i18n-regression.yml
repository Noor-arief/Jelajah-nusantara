name: Phase 1.5 NUSA Callout i18n Regression

on:
  push:
    branches:
      - phase-1.5-nusa-callout-i18n
    paths:
      - ".github/workflows/phase1.5-nusa-callout-i18n-regression.yml"
      - "assets/ui-motion-polish.js"
      - "index.html"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1.5-nusa-callout-i18n

      - run: python -m pip install selenium --quiet

      - name: Validate 8-language NUSA callout on live origin
        shell: bash
        run: |
          python - <<'PY'
          import json, shutil, time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options

          expected={
            "en":"Ask anything with NUSA",
            "id":"Tanyakan apa pun ke NUSA",
            "zh":"向 NUSA 询问任何问题",
            "ja":"NUSAに何でも聞いてみよう",
            "ko":"NUSA에게 무엇이든 물어보세요",
            "ar":"اسأل NUSA عن أي شيء",
            "nl":"Vraag NUSA gerust alles",
            "th":"ถาม NUSA ได้ทุกเรื่อง",
          }

          branch_js=Path("assets/ui-motion-polish.js").read_text(encoding="utf-8")
          opts=Options()
          opts.binary_location=shutil.which("google-chrome")
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--window-size=430,932")
          d=webdriver.Chrome(options=opts)
          d.get("https://noor-arief.github.io/Jelajah-nusantara/")
          time.sleep(4)

          d.execute_script("""
            const h=document.getElementById('vireqo-ai-jelnusa-staging');
            const r=h&&h.shadowRoot;
            if(r){
              const old=r.getElementById('jl-nusa-motion-v1');
              if(old) old.remove();
              const c=r.querySelector('.jl-nusa-callout');
              if(c) c.remove();
            }
            if(h) delete h.dataset.jlCalloutI18n;
          """)
          d.execute_script(branch_js)
          time.sleep(1)

          for lang in ["en","id","zh","ja","ko","ar","nl","th"]:
            if d.execute_script("return document.documentElement.lang") != lang:
              d.find_element(By.CSS_SELECTOR,'.jl-language-trigger').click()
              time.sleep(.25)
              d.find_element(By.CSS_SELECTOR,f'.jl-language-menu button[data-lang="{lang}"]').click()
              time.sleep(.45)

            state=d.execute_script("""
              const r=document.getElementById('vireqo-ai-jelnusa-staging').shadowRoot;
              const c=r.querySelector('.jl-nusa-callout');
              return {
                htmlLang:document.documentElement.lang,
                text:c&&c.textContent,
                lang:c&&c.lang,
                dir:c&&c.dir,
                display:c&&getComputedStyle(c).display
              };
            """)
            print(lang,json.dumps(state,ensure_ascii=False))
            assert state["htmlLang"]==lang,(lang,state)
            assert state["text"]==expected[lang],(lang,state)
            assert state["lang"]==lang,(lang,state)
            assert state["dir"]==("rtl" if lang=="ar" else "ltr"),(lang,state)
            assert state["display"]!="none",(lang,state)

          d.execute_script("""
            const r=document.getElementById('vireqo-ai-jelnusa-staging').shadowRoot;
            r.querySelector('.vireqo-ai-launcher').click();
          """)
          time.sleep(.3)
          display=d.execute_script("""
            const r=document.getElementById('vireqo-ai-jelnusa-staging').shadowRoot;
            return getComputedStyle(r.querySelector('.jl-nusa-callout')).display;
          """)
          assert display=="none",display

          d.quit()
          print("PASS: NUSA callout follows all 8 selected languages.")
          PY
