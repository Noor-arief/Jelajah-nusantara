name: Phase 4 Destination Modal Affiliate Regression

on:
  push:
    branches:
      - phase4-destination-modal-affiliate-hotfix
    paths:
      - ".github/workflows/phase4-destination-modal-affiliate-regression.yml"
      - "affiliate/affiliate-card-integration.js"
      - "affiliate/affiliate-ui.css"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4-destination-modal-affiliate-hotfix

      - run: python -m pip install selenium --quiet

      - name: Start local site
        run: |
          python -m http.server 8080 >/tmp/phase4-modal.log 2>&1 &
          echo $! >/tmp/phase4-modal.pid
          sleep 2

      - name: Validate card and destination modal affiliate controls
        shell: bash
        run: |
          python - <<'PY'
          import json,shutil,time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options

          labels={
            "id":"Cari Penginapan","en":"Find Stays","zh":"查找住宿","ja":"宿泊先を探す",
            "ko":"숙소 찾기","ar":"ابحث عن إقامة","nl":"Vind verblijf","th":"ค้นหาที่พัก"
          }

          o=Options();o.binary_location=shutil.which('google-chrome')
          o.add_argument('--headless=new');o.add_argument('--no-sandbox');o.add_argument('--disable-dev-shm-usage')
          o.add_argument('--window-size=430,932')
          d=webdriver.Chrome(options=o)
          d.get('http://127.0.0.1:8080/')
          time.sleep(4)

          # Card must be an actual same-tab navigable link.
          card=d.find_element(By.XPATH,"//*[contains(@class,'region-card')][.//h3[normalize-space()='Raja Ampat']]")
          card_link=card.find_element(By.CSS_SELECTOR,'.jl-affiliate-card-cta')
          assert not card_link.get_attribute('target'),card_link.get_attribute('target')
          assert 'assistant.vireqo.id/affiliate/out' in card_link.get_attribute('href')

          # Modal in all languages must expose three live stay links and remove old coming-soon copy.
          for lang,label in labels.items():
            if d.execute_script("return document.documentElement.lang") != lang:
              d.find_element(By.CSS_SELECTOR,'.jl-language-trigger').click()
              time.sleep(.2)
              d.find_element(By.CSS_SELECTOR,f'.jl-language-menu button[data-lang="{lang}"]').click()
              time.sleep(.4)

            d.execute_script("openDestination('Raja Ampat')")
            time.sleep(.4)
            state=d.execute_script("""
              const m=document.getElementById('destinationDetailModal');
              return {
                stay:m.querySelector('.jl-destination-stay-cta')?.href||null,
                stayText:m.querySelector('.jl-modal-stay-label')?.textContent.trim()||null,
                book:m.querySelector('.jl-things-book-stay')?.href||null,
                bottom:m.querySelector('.jl-destination-bottom-stay')?.href||null,
                bottomText:m.querySelector('.jl-destination-bottom-stay')?.textContent.trim()||null,
                text:m.innerText
              }
            """)
            print(lang,json.dumps(state,ensure_ascii=False))
            assert state['stay'] and 'destination=Raja%20Ampat' in state['stay'],(lang,state)
            assert state['book'] and 'destination=Raja%20Ampat' in state['book'],(lang,state)
            assert state['bottom'] and 'destination=Raja%20Ampat' in state['bottom'],(lang,state)
            assert state['stayText']==label,(lang,state)
            assert state['bottomText'].startswith(label),(lang,state)
            assert 'Booking Link Coming Soon' not in state['text'],(lang,state)
            assert 'Tautan Pemesanan Segera Hadir' not in state['text'],(lang,state)

            d.execute_script("closeDestination()")
            time.sleep(.15)

          assert d.execute_script("return document.documentElement.scrollWidth <= innerWidth + 2")
          d.quit()
          print('PASS destination modal affiliate regression')
          PY

      - name: Stop local
        if: always()
        run: |
          if [ -f /tmp/phase4-modal.pid ]; then kill "$(cat /tmp/phase4-modal.pid)" || true; fi
