name: Phase 4 Affiliate Button Live Audit

on:
  push:
    branches:
      - phase4-affiliate-button-hotfix
    paths:
      - ".github/workflows/phase4-affiliate-button-live-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4-affiliate-button-hotfix

      - run: python -m pip install selenium --quiet

      - name: Audit live card CTA interaction
        shell: bash
        run: |
          python - <<'PY'
          import json,shutil,time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options

          o=Options();o.binary_location=shutil.which('google-chrome')
          o.add_argument('--headless=new');o.add_argument('--no-sandbox');o.add_argument('--disable-dev-shm-usage')
          o.add_argument('--window-size=430,932')
          d=webdriver.Chrome(options=o)
          d.get('https://noor-arief.github.io/Jelajah-nusantara/')
          time.sleep(5)

          a=d.find_element(By.CSS_SELECTOR,'.region-card .jl-affiliate-card-cta')
          before=d.window_handles[:]
          href=a.get_attribute('href')
          rect=d.execute_script("""
            const a=arguments[0],r=a.getBoundingClientRect(),cs=getComputedStyle(a);
            return {
              href:a.href,
              text:a.innerText,
              pointerEvents:cs.pointerEvents,
              display:cs.display,
              visibility:cs.visibility,
              opacity:cs.opacity,
              zIndex:cs.zIndex,
              rect:{x:r.x,y:r.y,w:r.width,h:r.height},
              parent:a.parentElement.outerHTML.slice(0,4000),
              card:a.closest('.region-card').outerHTML.slice(0,7000)
            }
          """,a)
          print('AUDIT',json.dumps(rect,ensure_ascii=False,indent=2))

          click_error=None
          try:
            d.execute_script("arguments[0].scrollIntoView({block:'center'})",a)
            time.sleep(.2)
            a.click()
            time.sleep(1.2)
          except Exception as e:
            click_error=repr(e)

          after=d.window_handles[:]
          current=d.current_url
          out={
            'href':href,
            'before_handles':before,
            'after_handles':after,
            'current_url':current,
            'click_error':click_error,
            'audit':rect
          }
          if len(after)>len(before):
            newh=[x for x in after if x not in before][0]
            d.switch_to.window(newh)
            out['new_window_url']=d.current_url
          Path('phase4-affiliate-button-live-audit.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          d.quit()
          PY

      - name: Commit audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase4-affiliate-button-live-audit.json
          git commit -m "chore: audit live affiliate button interaction"
          git push origin HEAD:phase4-affiliate-button-hotfix
