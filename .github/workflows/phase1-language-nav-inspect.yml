name: Phase 1 Language Nav Inspection

on:
  push:
    branches:
      - phase-1-language-nav-hotfix
    paths:
      - ".github/workflows/phase1-language-nav-inspect.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1-language-nav-hotfix
          fetch-depth: 1

      - name: Extract exact mobile header and language context
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          s=Path("index.html").read_text(encoding="utf-8")
          tokens=[
            ".header-container",
            ".header-actions",
            ".nav-toggle",
            "@media (max-width: 768px)",
            "@media (max-width:768px)",
            "closeBtn?.addEventListener",
            "querySelectorAll('button[data-lang]')",
            'querySelectorAll("button[data-lang]")',
            "applyLanguage("
          ]
          out=[]
          for token in tokens:
              start=0
              while True:
                  i=s.find(token,start)
                  if i<0: break
                  a=max(0,i-1400); b=min(len(s),i+3200)
                  out.append({"token":token,"offset":i,"snippet":s[a:b]})
                  start=i+len(token)
                  if len([x for x in out if x["token"]==token])>=6: break
          Path("phase1-language-nav-inspection.json").write_text(
              json.dumps({"matches":out},ensure_ascii=False,indent=2),encoding="utf-8")
          PY

      - name: Commit inspection report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase1-language-nav-inspection.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refine mobile language nav inspection"
          git push origin HEAD:phase-1-language-nav-hotfix
