name: Phase 1 Language Nav Inspection

on:
  push:
    branches:
      - phase-1-language-nav-hotfix
    paths:
      - ".github/workflows/phase1-language-nav-inspect.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1-language-nav-hotfix
          fetch-depth: 1

      - name: Extract language navigation context
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          patterns=[
            "jelnusa-lang","language","lang-","language-","🇹🇭","ภาษาไทย",
            "Thai","dropdown","selector","switcher"
          ]
          out=[]
          seen=set()
          for pat in patterns:
              for m in re.finditer(re.escape(pat), s, re.I):
                  a=max(0,m.start()-900); b=min(len(s),m.end()+1400)
                  sn=s[a:b]
                  key=sn[:120]
                  if key in seen: continue
                  seen.add(key)
                  out.append({"pattern":pat,"offset":m.start(),"snippet":sn})
                  if len(out)>=40: break
              if len(out)>=40: break
          Path("phase1-language-nav-inspection.json").write_text(
              json.dumps({"matches":out},ensure_ascii=False,indent=2),encoding="utf-8")
          PY

      - name: Commit inspection report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase1-language-nav-inspection.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: inspect mobile language navigation"
          git push origin HEAD:phase-1-language-nav-hotfix
