name: Phase 3 Destination Intelligence Audit

on:
  push:
    branches:
      - phase-3-nusa-intelligence-audit
    paths:
      - ".github/workflows/phase3-destination-intelligence-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3-nusa-intelligence-audit

      - run: python -m pip install selenium --quiet

      - name: Inspect live destination data
        shell: bash
        run: |
          python - <<'PY'
          import json, shutil, time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          opts=Options()
          opts.binary_location=shutil.which("google-chrome")
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--window-size=1440,1400")

          d=webdriver.Chrome(options=opts)
          d.get("https://noor-arief.github.io/Jelajah-nusantara/")
          time.sleep(4)

          data=d.execute_script("""
          const keys=Object.keys(window).filter(k=>/dest|region|travel|guide/i.test(k));
          const globals={};
          for(const k of keys){
            try{
              const v=window[k];
              if(Array.isArray(v) && v.length && v.length<500){
                globals[k]=v.slice(0,200);
              }else if(v && typeof v==='object' && Object.keys(v).length && Object.keys(v).length<500){
                globals[k]=v;
              }
            }catch{}
          }
          const cards=[...document.querySelectorAll('.region-card')].map(card=>({
            name:(card.querySelector('h3,h4')?.textContent||'').trim(),
            region:(card.querySelector('.region-card-region')?.textContent||'').trim(),
            description:(card.querySelector('p')?.textContent||'').trim(),
            text:(card.innerText||'').trim()
          }));
          const tabs=[...document.querySelectorAll('.region-tab')].map(x=>({text:x.textContent.trim(),dataset:{...x.dataset}}));
          return {keys,globals,cards,tabs};
          """)
          Path("phase3-destination-intelligence-audit.json").write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding="utf-8")
          d.quit()
          PY

      - name: Commit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase3-destination-intelligence-audit.json
          git commit -m "chore: audit live destination intelligence"
          git push origin HEAD:phase-3-nusa-intelligence-audit
