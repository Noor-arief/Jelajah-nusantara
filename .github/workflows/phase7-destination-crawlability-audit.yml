name: JelNusa Phase 7 Destination Crawlability Audit

on:
  push:
    branches:
      - phase7-destination-crawlability
    paths:
      - ".github/workflows/phase7-destination-crawlability-audit.yml"
      - "tools/phase7_destination_crawlability_audit.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase7-destination-crawlability
          fetch-depth: 1

      - name: Audit existing destination content
        run: python tools/phase7_destination_crawlability_audit.py

      - name: Validate audit only
        shell: bash
        run: |
          set -euo pipefail
          test -f phase7-destination-crawlability-audit.json
          grep -q '"status": "PASS"' phase7-destination-crawlability-audit.json
          test "$(grep -o 'https://assistant.vireqo.id/client.js' index.html | wc -l)" -eq 1
          test "$(grep -o 'data-client-id="jelnusa-staging"' index.html | wc -l)" -eq 1
          git diff --check

      - name: Commit audit report
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase7-destination-crawlability-audit.json
          git commit -m "Phase 7: audit crawlable destination content"
          git push origin HEAD:phase7-destination-crawlability
