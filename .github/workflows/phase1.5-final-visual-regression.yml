name: Phase 1.5 Final Visual Regression

on:
  push:
    branches:
      - phase-1.5-final-visual-fixes
    paths:
      - ".github/workflows/phase1.5-final-visual-regression.yml"
      - "assets/ui-motion-polish.css"
      - "assets/ui-motion-polish.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1.5-final-visual-fixes
      - run: python -m pip install selenium --quiet

      - name: Start local site
        shell: bash
        run: |
          python -m http.server 8080 >/tmp/jelnusa-http.log 2>&1 &
          echo $! >/tmp/jelnusa-http.pid
          sleep 2

      - name: Validate hero + footer locally
        shell: bash
        run: |
          python - <<'PY'
          import json, shutil, time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options

          opts=Options()
          opts.binary_location=shutil.which("google-chrome")
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--window-size=1440,1000")
          d=webdriver.Chrome(options=opts)
          d.get("http://127.0.0.1:8080/")
          time.sleep(3)

          s=d.execute_script("""
          const hero=document.querySelector('.hero');
          const hc=document.querySelector('.hero-container');
          const h1=document.querySelector('.hero h1');
          const footer=document.querySelector('footer');
          const dead=[...footer.querySelectorAll('a[hidden],button[hidden]')];
          const socials=[...footer.querySelectorAll('a')].filter(a=>['📸','f','𝕏','P'].includes((a.textContent||'').trim()));
          return {
            heroPad:getComputedStyle(hero).paddingTop,
            containerPad:getComputedStyle(hc).paddingTop,
            heroY:hero.getBoundingClientRect().y,
            titleY:h1.getBoundingClientRect().y,
            gap:h1.getBoundingClientRect().y-hero.getBoundingClientRect().y,
            hiddenDisplays:dead.map(e=>getComputedStyle(e).display),
            socialDisplays:socials.map(e=>getComputedStyle(e).display),
            email:footer.querySelector('.jl-footer-email')?.getAttribute('href')
          };
          """)
          print(json.dumps(s,indent=2))
          assert s["heroPad"]=="24px",s
          assert s["containerPad"]=="16px",s
          assert s["gap"] < 70,s
          assert all(x=="none" for x in s["hiddenDisplays"]),s
          assert all(x=="none" for x in s["socialDisplays"]),s
          assert s["email"]=="mailto:arifmuhamad94@gmail.com",s

          # Phase 1 language fix still survives.
          for lang in ["id","th","en"]:
            d.find_element(By.CSS_SELECTOR,'.jl-language-trigger').click()
            time.sleep(.2)
            d.find_element(By.CSS_SELECTOR,f'.jl-language-menu button[data-lang="{lang}"]').click()
            time.sleep(.3)
            assert d.execute_script("return document.documentElement.lang")==lang

          d.quit()
          print("PASS hero/footer/language")
          PY

      - name: Validate live-origin NUSA callout with branch JS
        shell: bash
        run: |
          python - <<'PY'
          import json, shutil, time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          branch_js=Path("assets/ui-motion-polish.js").read_text(encoding="utf-8")
          opts=Options()
          opts.binary_location=shutil.which("google-chrome")
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--window-size=430,932")
          d=webdriver.Chrome(options=opts)
          d.get("https://noor-arief.github.io/Jelajah-nusantara/")
          time.sleep(4)

          d.execute_script("""
          const r=document.getElementById('vireqo-ai-jelnusa-staging').shadowRoot;
          const old=r&&r.getElementById('jl-nusa-motion-v1');
          if(old) old.remove();
          const callout=r&&r.querySelector('.jl-nusa-callout');
          if(callout) callout.remove();
          """)
          d.execute_script(branch_js)
          time.sleep(1)

          s=d.execute_script("""
          const r=document.getElementById('vireqo-ai-jelnusa-staging').shadowRoot;
          const c=r.querySelector('.jl-nusa-callout');
          const l=r.querySelector('.vireqo-ai-launcher');
          return {
            exists:!!c,
            text:c?.textContent||'',
            display:c?getComputedStyle(c).display:null,
            opacity:c?getComputedStyle(c).opacity:null,
            launcherH:l.getBoundingClientRect().height
          };
          """)
          print(json.dumps(s,indent=2))
          assert s["exists"],s
          assert s["text"]=="Ask anything with NUSA",s
          assert s["display"]!="none",s
          assert s["launcherH"]>=58,s

          d.execute_script("""
          const r=document.getElementById('vireqo-ai-jelnusa-staging').shadowRoot;
          r.querySelector('.vireqo-ai-launcher').click();
          """)
          time.sleep(.4)
          hidden=d.execute_script("""
          const r=document.getElementById('vireqo-ai-jelnusa-staging').shadowRoot;
          return getComputedStyle(r.querySelector('.jl-nusa-callout')).display;
          """)
          assert hidden=="none",hidden
          d.quit()
          print("PASS NUSA callout")
          PY

      - name: Stop local
        if: always()
        run: |
          if [ -f /tmp/jelnusa-http.pid ]; then kill "$(cat /tmp/jelnusa-http.pid)" || true; fi
