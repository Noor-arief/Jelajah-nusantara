name: Phase 4 Booking CTA Simplify Patch

on:
  push:
    branches:
      - phase4-booking-cta-simplify
    paths:
      - ".github/workflows/phase4-booking-cta-simplify.yml"
      - "affiliate/affiliate-card-integration.js"
      - "affiliate/affiliate-ui.css"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4-booking-cta-simplify
          fetch-depth: 1

      - name: Cache-bust affiliate assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          s=s.replace("affiliate/affiliate-ui.css?v=20260928a","affiliate/affiliate-ui.css?v=20260928b")
          s=s.replace("affiliate/affiliate-card-integration.js?v=20260928a","affiliate/affiliate-card-integration.js?v=20260928b")
          if "affiliate/affiliate-ui.css?v=20260928b" not in s:
              raise SystemExit("affiliate CSS marker missing")
          if "affiliate/affiliate-card-integration.js?v=20260928b" not in s:
              raise SystemExit("affiliate JS marker missing")
          p.write_text(s,encoding="utf-8")
          PY
          git diff --check

      - name: Commit cache-bust
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: cache-bust simplified booking CTA assets"
          git push origin HEAD:phase4-booking-cta-simplify
