name: Phase 4 Card Body Audit

on:
  push:
    branches:
      - phase-4-affiliate-integration
    paths:
      - ".github/workflows/phase4-card-body-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-affiliate-integration
      - run: python -m pip install selenium --quiet
      - name: Inspect card body descendants
        shell: bash
        run: |
          python - <<'PY'
          import json,shutil,time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          o=Options();o.binary_location=shutil.which("google-chrome")
          o.add_argument("--headless=new");o.add_argument("--no-sandbox");o.add_argument("--disable-dev-shm-usage");o.add_argument("--window-size=1440,1200")
          d=webdriver.Chrome(options=o);d.get("https://noor-arief.github.io/Jelajah-nusantara/");time.sleep(4)
          data=d.execute_script("""
            const b=document.querySelector('.region-card .region-card-body');
            return {
              html:b?.innerHTML||'',
              children:[...(b?.children||[])].map(x=>({
                tag:x.tagName,className:String(x.className||''),text:(x.innerText||x.textContent||'').trim(),
                href:x.getAttribute('href'),type:x.getAttribute('type')
              }))
            }
          """)
          Path("phase4-card-body-audit.json").write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding="utf-8")
          d.quit()
          PY
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase4-card-body-audit.json
          git commit -m "chore: audit Phase 4 card body"
          git push origin HEAD:phase-4-affiliate-integration
