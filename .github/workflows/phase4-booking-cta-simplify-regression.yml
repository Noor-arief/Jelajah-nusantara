name: Phase 4 Booking CTA Simplify Regression

on:
  push:
    branches:
      - phase4-booking-cta-simplify
    paths:
      - ".github/workflows/phase4-booking-cta-simplify-regression.yml"
      - "affiliate/**"
      - "index.html"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4-booking-cta-simplify
      - run: python -m pip install selenium --quiet

      - name: Start local site
        run: |
          python -m http.server 8080 >/tmp/phase4-simplify.log 2>&1 &
          echo $! >/tmp/phase4-simplify.pid
          sleep 2

      - name: Validate card and modal booking CTA behavior
        shell: bash
        run: |
          python - <<'PY'
          import json,shutil,time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options

          def make_driver():
              o=Options();o.binary_location=shutil.which('google-chrome')
              o.add_argument('--headless=new');o.add_argument('--no-sandbox');o.add_argument('--disable-dev-shm-usage')
              o.add_argument('--window-size=430,932')
              return webdriver.Chrome(options=o)

          # Card CTA: native anchor, target blank, actual new tab.
          d=make_driver()
          d.get('http://127.0.0.1:8080/')
          time.sleep(4)
          card=d.find_element(By.XPATH,"//*[contains(@class,'region-card')][.//h3[normalize-space()='Raja Ampat']]")
          a=card.find_element(By.CSS_SELECTOR,'.jl-affiliate-card-cta')
          state=d.execute_script("""
            const a=arguments[0];
            return {
              href:a.href,
              target:a.getAttribute('target'),
              onclick:a.getAttribute('onclick'),
              text:a.innerText.trim()
            }
          """,a)
          print('CARD',json.dumps(state,ensure_ascii=False))
          assert state['target']=='_blank',state
          assert state['onclick'] in (None,''),state
          assert 'assistant.vireqo.id/affiliate/out' in state['href'],state

          before=d.window_handles[:]
          d.execute_script("arguments[0].scrollIntoView({block:'center'})",a)
          time.sleep(.2)
          a.click()
          for _ in range(25):
              time.sleep(.2)
              if len(d.window_handles)>len(before): break
          assert len(d.window_handles)==len(before)+1,(before,d.window_handles)
          d.quit()

          # Modal: only one active booking link, Accommodation — Available.
          d=make_driver()
          d.get('http://127.0.0.1:8080/')
          time.sleep(4)
          d.execute_script("openDestination('Raja Ampat')")
          time.sleep(.5)

          modal=d.find_element(By.ID,'destinationDetailModal')
          mstate=d.execute_script("""
            const m=arguments[0];
            const booking=[...m.querySelectorAll('a')].filter(a=>a.href.includes('/affiliate/out'));
            return {
              bookingCount:booking.length,
              booking:booking.map(a=>({
                className:a.className,
                text:a.textContent.trim(),
                target:a.getAttribute('target'),
                onclick:a.getAttribute('onclick'),
                href:a.href
              })),
              stayButtons:m.querySelectorAll('.jl-destination-stay-cta').length,
              bottomStay:m.querySelectorAll('.jl-destination-bottom-stay').length,
              thingsStay:m.querySelectorAll('.jl-things-book-stay').length,
              text:m.innerText
            }
          """,modal)
          print('MODAL',json.dumps(mstate,ensure_ascii=False,indent=2))
          assert mstate['bookingCount']==1,mstate
          assert mstate['stayButtons']==0,mstate
          assert mstate['bottomStay']==0,mstate
          assert mstate['thingsStay']==1,mstate
          active=mstate['booking'][0]
          assert active['target']=='_blank',active
          assert active['onclick'] in (None,''),active
          assert 'Available' in active['text'] or 'Tersedia' in active['text'],active

          before=d.window_handles[:]
          link=d.find_element(By.CSS_SELECTOR,'#destinationDetailModal .jl-things-book-stay')
          d.execute_script("arguments[0].scrollIntoView({block:'center'})",link)
          time.sleep(.2)
          link.click()
          for _ in range(25):
              time.sleep(.2)
              if len(d.window_handles)>len(before): break
          assert len(d.window_handles)==len(before)+1,(before,d.window_handles)

          # 8-language modal must still retain one booking CTA only.
          d.quit()
          d=make_driver()
          d.get('http://127.0.0.1:8080/')
          time.sleep(4)
          for lang in ['id','en','zh','ja','ko','ar','nl','th']:
              if d.execute_script("return document.documentElement.lang") != lang:
                  d.find_element(By.CSS_SELECTOR,'.jl-language-trigger').click();time.sleep(.15)
                  d.find_element(By.CSS_SELECTOR,f'.jl-language-menu button[data-lang="{lang}"]').click();time.sleep(.35)
              d.execute_script("openDestination('Raja Ampat')");time.sleep(.3)
              count=d.execute_script("""
                const m=document.getElementById('destinationDetailModal');
                return [...m.querySelectorAll('a')].filter(a=>a.href.includes('/affiliate/out')).length;
              """)
              assert count==1,(lang,count)
              d.execute_script("closeDestination()");time.sleep(.1)
          d.quit()
          print('PASS simplified booking CTA regression')
          PY

      - name: Stop local
        if: always()
        run: |
          if [ -f /tmp/phase4-simplify.pid ]; then kill "$(cat /tmp/phase4-simplify.pid)" || true; fi
