name: Phase 1 Language Reopen Validation v6

on:
  push:
    branches:
      - phase-1-language-reopen-hotfix-v6
    paths:
      - ".github/workflows/phase1-language-reopen-validation-v6.yml"
      - "assets/language-mobile-hotfix.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1-language-reopen-hotfix-v6

      - run: python -m pip install selenium --quiet

      - name: Validate open-select-reopen-select
        shell: bash
        run: |
          python -m http.server 8080 >/tmp/jelnusa-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2

          python - <<'PY'
          import json, shutil, time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options

          opts=Options()
          opts.binary_location=shutil.which("google-chrome")
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--window-size=430,932")

          d=webdriver.Chrome(options=opts)
          d.get("http://127.0.0.1:8080/")
          time.sleep(1.5)

          def inspect(label):
              state=d.execute_script("""
                const m=document.querySelector('.jl-language-menu');
                const b=document.querySelector('.jl-language-backdrop');
                const r=m.getBoundingClientRect();
                const c=getComputedStyle(m);
                return {
                  label:arguments[0],
                  lang:document.documentElement.lang,
                  menuParent:m.parentElement.tagName,
                  top:r.top,bottom:r.bottom,height:r.height,innerHeight:innerHeight,
                  display:c.display,visibility:c.visibility,opacity:c.opacity,pointer:c.pointerEvents,
                  backdropClass:b?b.className:null
                };
              """,label)
              print(json.dumps(state,ensure_ascii=False))
              return state

          # First open -> Indonesian
          d.find_element(By.CSS_SELECTOR,".jl-language-trigger").click()
          time.sleep(.4)
          s1=inspect("open1")
          assert s1["display"]!="none" and s1["visibility"]=="visible" and s1["opacity"]=="1", s1
          assert s1["top"]>=0 and s1["bottom"]<=s1["innerHeight"]+2, s1

          d.find_element(By.CSS_SELECTOR,'.jl-language-menu button[data-lang="id"]').click()
          time.sleep(.7)
          assert d.execute_script("return document.documentElement.lang")=="id"

          # Second open -> Thai
          d.find_element(By.CSS_SELECTOR,".jl-language-trigger").click()
          time.sleep(.4)
          s2=inspect("open2")
          assert s2["display"]!="none" and s2["visibility"]=="visible" and s2["opacity"]=="1", s2
          assert s2["top"]>=0 and s2["bottom"]<=s2["innerHeight"]+2, s2

          d.find_element(By.CSS_SELECTOR,'.jl-language-menu button[data-lang="th"]').click()
          time.sleep(.7)
          final=d.execute_script("""
            const b=document.querySelector('.jl-language-backdrop');
            const n=document.querySelector('#navBackdrop');
            const m=document.querySelector('.jl-language-menu');
            return {
              lang:document.documentElement.lang,
              backdrop:b?b.className:null,
              navBackdrop:n?n.className:null,
              menuDisplay:getComputedStyle(m).display,
              menuVisibility:getComputedStyle(m).visibility
            };
          """)
          print("FINAL",json.dumps(final,ensure_ascii=False))
          assert final["lang"]=="th", final
          assert "is-visible" not in (final["backdrop"] or ""), final
          assert "is-open" not in (final["navBackdrop"] or ""), final

          d.quit()
          print("PASS: language selector reopens after first selection and second language change succeeds.")
          PY
