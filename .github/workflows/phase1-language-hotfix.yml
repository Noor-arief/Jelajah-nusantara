name: Phase 1 Language Selector Hotfix

on:
  push:
    branches:
      - phase-1-language-position-hotfix-v5
    paths:
      - ".github/workflows/phase1-language-hotfix.yml"
      - "tools/phase1_language_hotfix.py"
      - "assets/language-mobile-hotfix.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1-language-position-hotfix-v5
          fetch-depth: 1

      - name: Apply isolated language overlay wiring
        run: python tools/phase1_language_hotfix.py

      - name: Validate protected scope
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'assets/language-mobile-hotfix.js?v=20260928e' index.html
          test "$(grep -o 'assets/language-mobile-hotfix.js?v=20260928e' index.html | wc -l)" -eq 1
          test "$(grep -o 'https://assistant.vireqo.id/client.js' index.html | wc -l)" -eq 1
          test "$(grep -o 'data-client-id="jelnusa-staging"' index.html | wc -l)" -eq 1
          test "$(find locales -maxdepth 1 -name '*.json' | wc -l)" -eq 8
          git diff --check

      - name: Commit patched index
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No index change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: wire mobile language position hotfix v5"
          git push origin HEAD:phase-1-language-position-hotfix-v5
